<script>

/* ------------------------------------------------------------------ defaults */

const ORIENT=[

const SCEN=["Demand minimum","Demand + growth margin","Roof maximum"];

 sgcx3:"https://info-support.sungrowpower.com/application/pdf/2025/05/14/DS_20250418_SG25_30_33CX-P2_Datasheet_V16_EN（India）.pdf",

 hw:"https://shop.solexis.ch/it/documents/file/onduleurs/huawei/ma_en_huawei_sun2000_30_40ktl-m3_v12.pdf",

const OKV="Datasheet values (per-MPPT currents derived from stated totals).";
const INV=[
 ["Sungrow","SG3.0RS","Single-phase",3,600,40,560,2,1,16,20,OKV+" 1 string/MPPT assumed.","sgrs"],
 ["Sungrow","SG5.0RS","Single-phase",5,600,40,560,2,1,16,20,OKV+" 1 string/MPPT assumed.","sgrs"],
 ["Growatt","MIN 10000TL-X","Single-phase",10,600,60,550,3,1,16.9,16.9,"VERIFY — datasheet table ambiguous (13.5 A or 16.9 A per MPPT).","min"],
 ["Growatt","MID 15KTL3-X","Three-phase",15,1100,200,1000,2,2,25,32,"VERIFY — editions differ; conservative values used.","mid"],
 ["Growatt","MID 20KTL3-X","Three-phase",20,1100,200,1000,2,2,25,32,"VERIFY — editions differ; conservative values used.","mid"],
 ["Growatt","MID 25KTL3-X","Three-phase",25,1100,200,1000,2,2,25,32,"VERIFY — editions differ; conservative values used.","mid"],
 ["Sungrow","SG25CX-P2","Three-phase",25,1100,160,1000,3,2,30,40,OKV,"sgcx3"],
 ["Sungrow","SG30CX-P2","Three-phase",30,1100,160,1000,3,2,30,40,OKV+" Source workbook used 32 A; V16 datasheet states 30 A.","sgcx3"],
 ["Sungrow","SG33CX-P2","Three-phase",33,1100,160,1000,3,2,30,40,OKV,"sgcx3"],
 ["Sungrow","SG36CX-P2","Three-phase",36,1100,160,1000,4,2,30,40,OKV,"sgcx4"],
 ["Sungrow","SG40CX-P2","Three-phase",40,1100,160,1000,4,2,30,40,OKV,"sgcx4"],
 ["Sungrow","SG50CX-P2","Three-phase",50,1100,160,1000,4,2,30,40,OKV,"sgcx4"],
 ["Huawei","SUN2000-30KTL-M3","Three-phase",30,1100,200,1000,4,2,26,40,"Datasheet values; 2 inputs/MPPT derived from 8 total.","hw"],
 ["Huawei","SUN2000-36KTL-M3","Three-phase",36,1100,200,1000,4,2,26,40,"Datasheet values; 2 inputs/MPPT derived.","hw"],
 ["Huawei","SUN2000-40KTL-M3","Three-phase",40,1100,200,1000,4,2,26,40,"Datasheet values; 2 inputs/MPPT derived.","hw"],
 ["Solis","S5-GC25K","Three-phase",25,1100,200,1000,3,2,32,40,"VERIFY — BD edition MPPT count not mapped per model; AU edition says 4 MPPT, 50 A Isc.","solis"],
 ["Solis","S5-GC30K","Three-phase",30,1100,200,1000,3,2,32,40,"VERIFY — as S5-GC25K.","solis"],
 ["Solis","S5-GC40K","Three-phase",40,1100,200,1000,4,2,32,40,"VERIFY — 4 MPPT inferred.","solis"],
 ["Sungrow","SG100CX-P2","Three-phase",100,1100,180,1000,12,2,30,50,OKV,"sg110"],
 ["Sungrow","SG110CX-P2","Three-phase",110,1100,180,1000,12,2,30,50,OKV,"sg110"]
].map(a=>({brand:a[0],model:a[1],phase:a[2],kw:a[3],vabs:a[4],vmin:a[5],vmax:a[6],mppt:a[7],spm:a[8],imax:a[9],iscmax:a[10],inc:"Yes",ver:a[11],src:SRC[a[12]]}));
const EQLIB=[["LED Tube Light (4-ft T8)",20],["LED Bulb",12],["Ceiling Fan (56-inch, AC motor)",75],["Split AC 1-Ton",1200],["Split AC 1.5-Ton",1650],["Split AC 2.0-Ton",2350],["Refrigerator",175],["Desktop Computer + Monitor",200],["Laptop",55],["Projector",275],["Interactive Smart Board",150],["Submersible Water Pump (1 HP)",750]].map(a=>({name:a[0],w:a[1]}));
const blankEq=()=>({loc:"",eq:"",qty:null,rooms:null,wovr:null,group:"",hovr:null,ufovr:null,cfovr:null,note:""});
const blankRoof=()=>({name:"",len:null,wid:null,area:null,use:"Yes",reserve:15,tilt:null,az:null});
function baseState(){return{
 site:{name:"",type:"",district:"",disco:"",lat:null,lon:null,phase:"Three-phase",sanc:null,opdays:220},
 groups:[{name:GROUPS[0],start:9,end:15.75,uf:0.85,cf:0.85},{name:GROUPS[1],start:0,end:24,uf:1,cf:1},{name:GROUPS[2],start:8,end:9.5,uf:1,cf:1}],
 design:{psh:4.5,derate:0.75,growth:0,rt:1.2,rmin:1.0,rmax:1.3,splim:10,umax:4,tmin:10,thot:65,albedo:0.2},
 module:{model:"Jinko JKM-600N-66HL4M-BDV",pmax:600,voc:48.29,vmp:40.66,isc:15.49,imp:14.76,tcvoc:-0.2414,tcvmp:-0.335,tcp:-0.29,tci:0.045,bif:0.80},
 equip:[blankEq(),blankEq(),blankEq()],
 roof:{sections:[blankRoof()],thumb:80,orient:ORIENT[0][0],oovr:null},
 scenario:SCEN[1], inv:{ovr:"",uovr:null}, layout:"Auto",
 lib:JSON.parse(JSON.stringify(INV)), eqlib:JSON.parse(JSON.stringify(EQLIB)), orient:ORIENT.map(o=>({name:o[0],f:o[1],basis:o[2]}))};}
function exampleState(){const s=baseState();
 Object.assign(s.site,{name:"Harirampur TSC (example)",type:"Technical School and College",district:"Manikganj",disco:"BREB (PBS)",phase:"Three-phase",sanc:30,opdays:220});
 const L=(loc,eq,qty,rooms,group,note)=>Object.assign(blankEq(),{loc,eq,qty,rooms,group,note});
 s.equip=[L("Classrooms, 5-storied (3rd-5th floor)","LED Tube Light (4-ft T8)",6,15,"Class-hour","6/room, 15 classrooms (transcript)"),
  L("Classrooms, 5-storied (3rd-5th floor)","Ceiling Fan (56-inch, AC motor)",8,15,"Class-hour","8/room (transcript)"),
  L("Ground floor labs","LED Tube Light (4-ft T8)",6,3,"Class-hour","ASSUMPTION: 3 lab rooms"),
  L("Ground floor labs","Ceiling Fan (56-inch, AC motor)",8,3,"Class-hour","ASSUMPTION: 3 lab rooms"),
  L("2nd floor trade labs","LED Tube Light (4-ft T8)",6,4,"Class-hour","ASSUMPTION: 4 trade labs"),
  L("2nd floor trade labs","Ceiling Fan (56-inch, AC motor)",8,4,"Class-hour","ASSUMPTION: 4 trade labs"),
  L("Principal's room","Split AC 1-Ton",1,1,"Class-hour","1 unit (transcript)"),
  L("Principal's room","Refrigerator",1,1,"Continuous (24h)","1 unit (transcript)"),
  L("Shared services","Submersible Water Pump (1 HP)",1,1,"Intermittent","1.5 h/day window")];
 s.roof.sections=[Object.assign(blankRoof(),{name:"Main roof",area:13302,tilt:23,az:0})];
 return s;}

/* ------------------------------------------------------------------ helpers */
const num=v=>typeof v==="number"&&isFinite(v);
const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ceil=x=>Math.ceil(x-1e-9), floor=x=>Math.floor(x+1e-9);
function f(v,d=0,u=""){if(!num(v))return v==null||v===""?"—":esc(v);return v.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d})+(u?" "+u:"");}
const pct=(v,d=0)=>num(v)?(v*100).toFixed(d)+"%":"—";
const isFlag=s=>typeof s==="string"&&s.startsWith("⚠");

/* ------------------------------------------------------------------ calculation */
function searchMin(N,roof,lmin,lmax,smax,ch){let b=null;if(!(N>0))return null;
 for(let S=1;S<=smax;S++){if(ch&&S%ch)continue;const L=Math.max(lmin,ceil(N/S));if(L>lmax)continue;const T=S*L;if(T>roof||T<=0)continue;
  if(!b||T<b.N||(T===b.N&&S<b.S))b={S,L,N:T};}return b;}
function searchMax(N,roof,lmin,lmax,smax){let b=null;const lim=Math.min(N,roof);if(!(lim>0))return null;
 for(let S=1;S<=smax;S++){const L=Math.min(lmax,floor(lim/S));if(L<lmin||L<=0)continue;const T=S*L;
  if(!b||T>b.N||(T===b.N&&S<b.S))b={S,L,N:T};}return b;}

function compute(s){
 const R={},M=s.module,D=s.design,G=s.groups;
 const gi=n=>G.findIndex(g=>g.name===n);
 const gh=g=>g.end>g.start?g.end-g.start:0;
 /* equipment */
 R.eq=s.equip.map(e=>{
  const has=[e.loc,e.eq,e.qty,e.rooms,e.wovr,e.group,e.hovr,e.ufovr,e.cfovr].some(v=>v!==null&&v!==""&&v!==undefined);
  const tq=num(e.qty)?e.qty*(num(e.rooms)?e.rooms:1):null;
  const lib=e.eq?s.eqlib.find(x=>x.name===e.eq):null;
  const libW=e.eq?(lib&&num(lib.w)?lib.w:"not in library"):null;
  const w=num(e.wovr)?e.wovr:(num(libW)?libW:null);
  const conn=num(tq)&&num(w)?tq*w:0;

let R=null;
function kv(rows){return `<div style="display:grid;gap:6px">${rows.map(r=>`<div class="kv"><span>${r[0]}</span><span>${r[1]}</span></div>`).join("")}</div>`;}
function chartSVG(){const W=720,H=220,l=44,b=26,t=10,r=8;const tot=R.hourly.map(x=>x[0]+x[1]+x[2]);let mx=Math.max(...tot,0.1);
 const step=[0.5,1,2,2.5,5,10,20,25,50,100].find(s=>mx/s<=5)||Math.ceil(mx/5);mx=Math.ceil(mx/step)*step;
 const y=v=>t+(H-t-b)*(1-v/mx),bw=(W-l-r)/24;let g="";
 for(let v=0;v<=mx+1e-9;v+=step)g+=`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${l-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${+v.toFixed(2)}</text>`;
 R.hourly.forEach((x,h)=>{let acc=0;["var(--g1)","var(--g2)","var(--g3)"].forEach((c,i)=>{if(x[i]>0){g+=`<rect x="${l+h*bw+2}" width="${bw-4}" y="${y(acc+x[i])}" height="${y(acc)-y(acc+x[i])}" fill="${c}"><title>${String(h).padStart(2,"0")}:00 ${GROUPS[i]} ${x[i].toFixed(2)} kW</title></rect>`;acc+=x[i];}});
  if(h%3===0)g+=`<text x="${l+h*bw+bw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${String(h).padStart(2,"0")}</text>`;});
 g+=`<text x="10" y="${t+4}" font-size="11" fill="var(--muted)" transform="rotate(-90 10 ${t+4})" text-anchor="end">kW</text>`;
 return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Hourly average load by group">${g}</svg></div>
 <div class="legend">${GROUPS.map((n,i)=>`<span><i style="background:var(--g${i+1})"></i>${n}</span>`).join("")}<span>Hour of day · average kW · ${f(R.day*100,0)}% of energy between 06:00 and 18:00</span></div>`;}
const D={
 status:()=>{const c=R.overall==="FAIL"?"fail":R.overall==="WARN"?"warn":"ok";const t=R.overall==="FAIL"?`Design not valid — ${R.nFail} fail, ${R.nWarn} warn`:R.overall==="WARN"?`Valid with ${R.nWarn} warning${R.nWarn>1?"s":""}`:"All checks pass";
  return `<div class="status ${c}">${pill(R.overall)}<span>${t}</span></div>`;},
 summary:()=>{const s=st(),d=R.d;return kv([["Maximum connected load",f(R.conn,2,"kW")],["Coincident peak demand",f(R.peak,2,"kW")],["Daily energy (operating day)",f(R.e,1,"kWh")],["Annual demand estimate",f(R.annual,0,"kWh/yr")],
  ["Panels — demand minimum",f(R.ndem)],["Roof maximum",f(R.nmax)],["Design panels",d?f(d.N):"—"],["Array capacity",d?f(d.kwp,2,"kWp"):"—"],["Coverage of operating-day demand",d?pct(d.cov):"—"],

  ${R.g.map(g=>`<tr><td>${esc(g.name)}</td><td class="n">${f(g.conn)}</td><td class="n">${f(g.pk)}</td><td class="n">${f(g.wh)}</td><td class="n">${pct(R.e>0?g.wh/1000/R.e:0)}</td></tr>`).join("")}

 req:()=>kv([["Daily energy (operating day)",f(R.e*1000,0,"Wh")],["Effective PSH (PSH × orientation)",f(R.pshe,2,"h")],["System derate",f(st().design.derate,2)],["Required array capacity",f(R.wp,0,"Wp")],["Panels required — demand minimum",`<b>${f(R.ndem)}</b>`]]),

  ${[...R.ranked,...R.ev.filter(x=>!num(x.score))].map(x=>{const rk=R.ranked.indexOf(x)+1;const el=String(x.status).startsWith("Eligible");
   return `<tr${x.model===R.sel?' style="background:var(--sunk)"':""}><td class="n">${rk||""}</td><td><b>${esc(x.model)}</b>${String(x.ver).startsWith("VERIFY")?" "+pill("warn","VERIFY"):""}</td><td>${esc(x.phase)}</td><td class="n">${f(x.kw)}</td><td class="n">${f(x.units)}</td><td class="n">${f(x.ratio,2)}</td>

   <td>${el?pill(x.status.includes("below")?"WARN":"PASS",x.status):`<span class="muted">${esc(x.status)}</span>`}</td></tr>`;}).join("")}</tbody></table></div>`,
 selinv:()=>{const v=R.inv;if(!v)return `<p class="flag">⚠ No inverter selected — see Inverters tab.</p>`;return kv([["Model",`<b>${esc(v.model)}</b> × ${f(R.units)}`],["Rated AC per unit",f(v.kw,1,"kW")],["Phase",esc(v.phase)],["Abs. max DC voltage",f(v.vabs,0,"V")],["MPPT window",`${f(v.vmin)}–${f(v.vmax)} V`],["MPPTs × inputs",`${f(v.mppt)} × ${f(v.spm)}`],["Max current / Isc per MPPT",`${f(v.imax,1)} / ${num(v.iscmax)?f(v.iscmax,1):"not entered"} A`],["Datasheet",stPill(R.T.ok)]]);},
 limits:()=>{const T=R.T;if(T.ok!=="OK")return `<p class="flag">${esc(T.ok)}</p>`;return kv([["Voc at winter min. (module)",f(R.voc_c,2,"V")],["Vmp at winter min. / summer max",`${f(R.vmp_c,2)} / ${f(R.vmp_h,2)} V`],["Max modules — absolute voltage",f(T.lmaxAbs)],["Max modules — MPPT window",f(T.lmaxMp)],["Modules per string (min–max)",`<b>${T.lmin}–${T.lmax}</b>`],["MPPT channels",f(T.ch)],["Max parallel strings per MPPT",f(T.par)],["Max strings accepted",f(T.smax)],["Target / roof maximum",`${f(R.n)} / ${f(R.nmax)}`],["Feasibility",stPill(T.feas)]]);},
 opts:()=>`<div class="opts">${[["A","Fewest panels ≥ target"],["B","Balanced MPPTs"],["C","Largest ≤ target"]].map(([k,t])=>{const o=R.opt[k];
  return `<div class="opt${R.optUsed===k?" sel":""}"><h4>Option ${k} — ${t} ${R.optUsed===k?pill("info","in use"):""}</h4>${o?kv([["Layout",`<b>${o.S} × ${o.L}</b>`],["Total panels",f(o.N)],["Array",f(o.kwp,2,"kWp")],["DC:AC",f(o.dcac,2)],["Strings per MPPT (max)",f(o.spm)],["Unused MPPTs",f(o.unused)],["Demand coverage",pct(o.cov)]])+`<div class="small muted">${esc(o.desc)}</div>`:`<p class="muted">No valid layout within the target and roof limits.</p>`}</div>`;}).join("")}</div>`,
 elec:()=>{const d=R.d,v=R.inv;if(!d)return `<p class="flag">⚠ No valid layout for the chosen option.</p>`;
  const r=(a,val,lim,okv)=>`<tr><td>${a}</td><td class="n">${val}</td><td class="n">${lim}</td><td>${okv?pill("PASS"):pill("FAIL")}</td></tr>`;
  return `<div class="scroll"><table><thead><tr><th>Check</th><th class="n">Value</th><th class="n">Limit</th><th>Status</th></tr></thead><tbody>
  ${r("String Voc at winter minimum",f(d.voc,1,"V")+` (${pct(d.vpct,1)})`,"< "+f(v.vabs,0,"V"),d.voc<v.vabs)}${r("String Vmp at STC",f(d.vstc,1,"V"),`${v.vmin}–${v.vmax} V`,d.vstc>=v.vmin&&d.vstc<=v.vmax)}
  ${r("String Vmp at summer max cell temp",f(d.vhot,1,"V"),"≥ "+f(v.vmin,0,"V"),d.vhot>=v.vmin)}${r("String Vmp at winter minimum",f(d.vcold,1,"V"),"≤ "+f(v.vmax,0,"V"),d.vcold<=v.vmax)}
  ${r("Strings per MPPT",f(d.spm),"≤ "+f(v.spm),d.spm<=v.spm)}${r("Operating current per MPPT",f(d.imp,2,"A"),"≤ "+f(v.imax,1,"A"),d.imp<=v.imax)}
  <tr><td>Short-circuit current per MPPT</td><td class="n">${f(d.isc,2,"A")}</td><td class="n">${num(v.iscmax)?"≤ "+f(v.iscmax,1,"A"):"not entered"}</td><td>${num(v.iscmax)?(d.isc<=v.iscmax?pill("PASS"):pill("FAIL")):pill("WARN")}</td></tr>
  ${r("Total panels vs roof maximum",f(d.N),"≤ "+f(R.nmax),d.N<=R.nmax)}</tbody></table></div><p class="note">Short-circuit current is the STC front-side value; bifacial rear gain adds current, so keep margin.</p>`;},
 checks:()=>`<div class="scroll"><table><thead><tr><th>#</th><th>Category</th><th>Check</th><th class="n">Value</th><th class="n">Limit</th><th>Status</th><th>Note</th></tr></thead><tbody>
  ${R.checks.map((c,i)=>`<tr><td class="muted">${i+1}</td><td>${c.cat}</td><td>${esc(c.check)}</td><td class="n">${typeof c.val==="string"?esc(c.val):c.val}</td><td class="n">${typeof c.lim==="string"?esc(c.lim):c.lim}</td><td>${pill(c.st)}</td><td class="small muted">${esc(c.note)}</td></tr>`).join("")}</tbody></table></div>`,
 team:()=>{if(TEAM.state==="loading")return `<p class="muted">Loading team…</p>`;if(TEAM.state==="off")return `<p class="muted">The team list is shown to signed-in viewers of this page.</p>`;
  if(TEAM.state==="error")return `<p class="err">The team list could not be loaded. Reload the page to try again.</p>`;
  if(!TEAM.list.length)return `<p class="muted">No team members yet.${TEAM.canEdit?" Add the first one with the form below.":""}</p>`;
  return `<div class="team">${TEAM.list.map(m=>{const ini=String(m.name||"?").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("");const url=safeUrl(m.link);
   return `<div class="member"><div class="avatar" aria-hidden="true">${esc(ini)}</div><b>${esc(m.name)}</b>${m.role?`<span class="role">${esc(m.role)}</span>`:""}${url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(url.replace(/^https?:\/\//,"").replace(/\/$/,""))}</a>`:""}
   ${TEAM.canEdit?`<div class="acts"><button type="button" data-tm-up="${esc(m.id)}" aria-label="Move ${esc(m.name)} earlier">↑</button><button type="button" data-tm-edit="${esc(m.id)}">Edit</button><button type="button" class="danger" data-tm-del="${esc(m.id)}">Remove</button></div>`:""}</div>`;}).join("")}</div>`;},
 pv:()=>`<div class="scroll"><table><tbody>${pvRows().map(r=>r.length===1?`<tr><th colspan="3">${esc(r[0])}</th></tr>`:`<tr><td>${esc(r[0])}</td><td class="n">${esc(r[1])}</td><td class="small muted">${esc(r[2]||"")}</td></tr>`).join("")}</tbody></table></div>`};
function pvRows(){const s=st(),d=R.d,v=R.inv,n=(x,dd=0)=>num(x)?+x.toFixed(dd):(x??"");
 return [["Site"],["Project / institution",s.site.name],["District",s.site.district],["Latitude",num(s.site.lat)?s.site.lat:"enter on Site tab","°N"],["Longitude",num(s.site.lon)?s.site.lon:"enter on Site tab","°E"],["Albedo",n(s.design.albedo,2)],
 ["Orientation"],["Field type","Fixed tilted plane"],["Plane tilt (main section)",n(R.mainTilt),"°"],["Azimuth (main section)",n(R.mainAz),"° (0 = South, −90 = East)"],["Orientation factor used in sizing",n(R.of,2),"replace with PVsyst transposition result"],
 ["System"],["PV module",s.module.model],["Module Pnom",n(s.module.pmax),"Wp"],["Number of modules",d?d.N:"none"],["Modules in series",d?d.L:"none"],["Number of strings",d?d.S:"none"],["Array Pnom",d?n(d.kwp,2):"none","kWp"],
 ["Inverter model",v?v.model:"none"],["Number of inverters",n(R.units)],["Inverter Pnom (each)",v?n(v.kw,2):"","kWac"],["MPPT inputs used / available",d?`${d.used} / ${R.T.ch}`:""],["String allocation",d?d.desc:""],["DC:AC (Pnom ratio)",d?n(d.dcac,2):""],
 ["Bifacial and temperatures"],["Bifaciality factor",n(s.module.bif,2)],["Design min ambient / max cell temperature",`${s.design.tmin} / ${s.design.thot}`,"°C"],
 ["Load (user needs)"],["Daily energy — operating day",n(R.e,2),"kWh/day"],["Daily energy — non-operating day",n(R.eCont,2),"kWh/day"],["Operating days per year",s.site.opdays],["Annual demand estimate",n(R.annual,0),"kWh/yr"],["Coincident peak demand",n(R.peak,2),"kW"],
 ["Design status"],["Overall",R.overall,`${R.nFail} fail · ${R.nWarn} warn`]];}

/* ------------------------------------------------------------------ paint */
function paintKpis(){const d=R.d;const k=[["Daily energy",f(R.e,1,"kWh")],["Panels",d?f(d.N):"—"],["Array",d?f(d.kwp,1,"kWp"):"—"],["Inverter",R.inv?`${R.sel} ×${R.units}`:"—"],["Layout",d?`${d.S} × ${d.L}`:"—"],["Status",`<span class="pill ${R.overall}">${R.overall}${R.nFail?" "+R.nFail:""}${!R.nFail&&R.nWarn?" "+R.nWarn:""}</span>`]];
 document.getElementById("kpis").innerHTML=k.map(x=>`<div class="kpi"><i>${x[0]}</i><b title="${esc(String(x[1]).replace(/<[^>]+>/g,""))}">${x[1]}</b></div>`).join("");}
function paintTabs(){const bad=c=>R.checks.some(x=>c.includes(x.cat)&&x.st==="FAIL");const map={load:["Inputs"],roof:["Roof"],inverters:["Inverter"],strings:["Strings","Electrical"],checks:["Inputs","Roof","Module","Inverter","Strings","Electrical","Rooftop","Configuration","Grid"]};
 document.getElementById("tabs").innerHTML=TABS.map(([id,t])=>`<a href="#${id}" ${id===tab?'aria-current="page"':""}>${t}${map[id]&&bad(map[id])?'<span class="dot" style="background:var(--fail)" aria-label="has failures"></span>':""}</a>`).join("");}
const set=(id,h)=>{const e=document.getElementById(id);if(e)e.innerHTML=h;};
function refresh(){R=compute(st());paintKpis();paintTabs();
 document.querySelectorAll("[data-dyn]").forEach(el=>{const fn=D[el.dataset.dyn];if(fn)el.innerHTML=fn();});
 R.eq.forEach((r,i)=>{set(`eq-${i}-tq`,f(r.tq));set(`eq-${i}-w`,r.libW==="not in library"&&!num(r.w)?'<span class="flag">not in library</span>':f(r.w));set(`eq-${i}-conn`,f(r.conn));set(`eq-${i}-h`,f(r.hrs,2));set(`eq-${i}-wh`,f(r.wh));set(`eq-${i}-pk`,f(r.pk));set(`eq-${i}-st`,stPill(r.st));});
 set("eq-tot-conn",f(R.conn*1000));set("eq-tot-wh",f(R.e*1000));set("eq-tot-pk",f(R.peak*1000));
 R.rf.forEach((r,i)=>{set(`rf-${i}-g`,f(r.gross));set(`rf-${i}-u`,f(r.usable));set(`rf-${i}-st`,stPill(r.st));});set("rf-tot-g",f(R.gross));set("rf-tot-u",f(R.usable));
 st().groups.forEach((g,i)=>set(`gh-${i}`,f(g.end>g.start?g.end-g.start:0,2)));
 const evByI={};R.ev.forEach(x=>evByI[x.i]=x);st().lib.forEach((v,i)=>{const x=evByI[i];set(`il-${i}`,x?stPill(x.chk):"");});teamChrome();}
function teamChrome(){const ed=document.getElementById("teamEditor");if(ed)ed.hidden=!TEAM.canEdit||TEAM.state!=="ready";
 const n=document.getElementById("teamNote");if(n)n.textContent=TEAM.state==="ready"&&!TEAM.canEdit?"Only the page owner and editors can change this list.":"";}
function render(){const s=st();
 document.getElementById("siteSel").innerHTML=store.order.map(id=>`<option value="${id}" ${id===store.cur?"selected":""}>${esc(store.sites[id].site.name||"Unnamed site")}</option>`).join("");
 document.getElementById("view").innerHTML=(V[tab]||V.overview)();refresh();}

/* ------------------------------------------------------------------ events */
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2200);}
async function copy(text,ok){try{await navigator.clipboard.writeText(text);toast(ok);}catch(e){const ta=document.getElementById("copyFallback")||(()=>{const t=document.createElement("textarea");t.id="copyFallback";document.getElementById("view").appendChild(t);return t;})();ta.hidden=false;ta.value=text;ta.focus();ta.select();toast("Selected — press Ctrl+C to copy");}}
document.addEventListener("input",ev=>{const el=ev.target;if(!el.dataset||!el.dataset.b)return;
 let v=el.value;if(el.dataset.t==="n"){v=v===""?null:Number(v);if(!isFinite(v))return;}
 setP(st(),el.dataset.b,v);save();
 if(el.dataset.b==="site.name")document.querySelector(`#siteSel option[value="${store.cur}"]`).textContent=v||"Unnamed site";
 if(el.dataset.b.startsWith("lib.")&&el.dataset.b.endsWith(".model")){refresh();return;}
 refresh();});
function parsePaste(t){return t.split(/\r?\n/).filter(l=>l.trim()).map(l=>{const c=l.split("\t").map(x=>x.trim());const n=x=>x===undefined||x===""?null:(isFinite(Number(x.replace(/,/g,"")))?Number(x.replace(/,/g,"")):null);
 return Object.assign(blankEq(),{loc:c[0]||"",eq:c[1]||"",qty:n(c[2]),rooms:n(c[3]),wovr:n(c[4]),group:c[5]||"",hovr:n(c[6]),note:c[7]||""});});}
let armed=null;
document.addEventListener("click",ev=>{const b=ev.target.closest("button");if(!b)return;const s=st();
 const disarm=()=>{if(armed&&armed!==b){armed.classList.remove("armed");armed.textContent=armed.dataset.label;}armed=null;};
 const confirm2=(label,fn)=>{if(armed===b){b.classList.remove("armed");b.textContent=b.dataset.label;armed=null;fn();}else{disarm();b.dataset.label=b.textContent;b.textContent=label;b.classList.add("armed");armed=b;}};
 if(b.dataset.delEq!==undefined){s.equip.splice(+b.dataset.delEq,1);if(!s.equip.length)s.equip.push(blankEq());save();render();return;}
 if(b.dataset.delRf!==undefined){s.roof.sections.splice(+b.dataset.delRf,1);if(!s.roof.sections.length)s.roof.sections.push(blankRoof());save();render();return;}
 if(b.dataset.delLib!==undefined){s.lib.splice(+b.dataset.delLib,1);save();render();return;}
 if(b.dataset.delEql!==undefined){s.eqlib.splice(+b.dataset.delEql,1);save();render();return;}
 if(b.dataset.tmEdit!==undefined){const m=TEAM.list.find(x=>x.id===b.dataset.tmEdit);if(!m)return;TEAM.editing=m.id;
  document.getElementById("tmName").value=m.name||"";document.getElementById("tmRole").value=m.role||"";document.getElementById("tmLink").value=m.link||"";
  document.getElementById("teamFormTitle").textContent="Edit team member";document.getElementById("tmSave").textContent="Save changes";document.getElementById("tmCancel").hidden=false;
  document.getElementById("tmName").focus();document.getElementById("teamEditor").scrollIntoView({block:"nearest"});return;}
 if(b.dataset.tmDel!==undefined){confirm2("Confirm remove",async()=>{try{await TEAM.col.doc(b.dataset.tmDel).delete();if(TEAM.editing===b.dataset.tmDel)teamReset();toast("Member removed");}catch(e){toast("Could not remove — "+(e&&e.message||"try again"));}});return;}
 if(b.dataset.tmUp!==undefined){const i=TEAM.list.findIndex(x=>x.id===b.dataset.tmUp);if(i<=0)return;const a=TEAM.list[i],p=TEAM.list[i-1];
  (async()=>{try{await TEAM.col.doc(a.id).update({order:p.order});await TEAM.col.doc(p.id).update({order:a.order===p.order?a.order+1:a.order});}catch(e){toast("Could not reorder — "+(e&&e.message||"try again"));}})();return;}
 switch(b.id){
  case"btnAddEq":s.equip.push(blankEq());save();render();break;
  case"btnClearEq":confirm2("Confirm clear",()=>{s.equip=[blankEq()];save();render();toast("Rows cleared");});break;
  case"btnAddRf":s.roof.sections.push(blankRoof());save();render();break;
  case"btnAddLib":s.lib.push({brand:"",model:"",phase:"Three-phase",kw:null,vabs:null,vmin:null,vmax:null,mppt:null,spm:null,imax:null,iscmax:null,inc:"Yes",ver:"User-added",src:""});save();render();break;
  case"btnResetLib":confirm2("Confirm restore",()=>{s.lib=JSON.parse(JSON.stringify(INV));s.inv.ovr="";save();render();toast("Default library restored");});break;
  case"btnAddEql":s.eqlib.push({name:"",w:null});save();render();break;
  case"btnPasteAdd":case"btnPasteReplace":{const rows=parsePaste(document.getElementById("pasteTxt").value);if(!rows.length){document.getElementById("pasteMsg").textContent="Nothing to add — paste rows first.";break;}
   if(b.id==="btnPasteReplace")s.equip=rows;else{s.equip=s.equip.filter(e=>[e.loc,e.eq,e.qty].some(v=>v!==null&&v!==""));s.equip.push(...rows);}save();render();toast(`${rows.length} row${rows.length>1?"s":""} added`);break;}
  case"btnNew":{const id="s"+Date.now();const ns=baseState();ns.site.name="New site "+(store.order.length+1);store.sites[id]=ns;store.order.push(id);store.cur=id;save();tab="site";location.hash="site";render();toast("New site created");break;}
  case"btnDup":{const id="s"+Date.now();const ns=JSON.parse(JSON.stringify(s));ns.site.name=(s.site.name||"Site")+" (copy)";store.sites[id]=ns;store.order.push(id);store.cur=id;save();render();toast("Site duplicated");break;}
  case"btnDel":confirm2("Confirm delete",()=>{delete store.sites[store.cur];store.order=store.order.filter(x=>x!==store.cur);if(!store.order.length){const id="s"+Date.now();store.sites[id]=exampleState();store.order=[id];}store.cur=store.order[0];save();render();toast("Site deleted");});break;
  case"btnCopyJson":copy(JSON.stringify({app:"rooftop-pv-sizer",v:1,site:s}),"Site data copied");break;
  case"btnShowImport":document.getElementById("importBox").hidden=false;break;
  case"btnImport":importText(document.getElementById("importTxt").value);break;
  case"btnCopyPv":copy(pvRows().map(r=>r.join("\t")).join("\n"),"Table copied — paste into Excel");break;
  case"tmCancel":teamReset();break;
  case"btnCopyHr":copy("Hour\tkW\n"+R.hourly.map((x,h)=>`${String(h).padStart(2,"0")}:00\t${(x[0]+x[1]+x[2]).toFixed(3)}`).join("\n"),"Hourly profile copied");break;
  default:disarm();}});
function importText(t){try{const x=JSON.parse(t);const s=x.site||x;if(!s.site||!s.equip||!s.lib)throw 0;const base=baseState();const ns=Object.assign(base,s);const id="s"+Date.now();store.sites[id]=ns;store.order.push(id);store.cur=id;save();render();toast("Site imported");}
 catch(e){toast("That text is not site data copied from this tool");}}
document.addEventListener("change",ev=>{if(ev.target.id==="siteSel"){store.cur=ev.target.value;save();render();}
 if(ev.target.id==="importFile"&&ev.target.files[0]){const r=new FileReader();r.onload=()=>importText(r.result);r.readAsText(ev.target.files[0]);}});
/* ------------------------------------------------------------------ team (shared, db) */
const TEAM={state:"loading",list:[],canEdit:false,col:null,editing:null};
function safeUrl(u){u=String(u||"").trim();if(!u)return"";if(!/^[a-z][a-z0-9+.-]*:/i.test(u))u="https://"+u;try{const x=new URL(u);return x.protocol==="https:"||x.protocol==="http:"?x.href:"";}catch(e){return"";}}
function teamReset(){TEAM.editing=null;const f=document.getElementById("teamForm");if(!f)return;f.reset();
 document.getElementById("teamFormTitle").textContent="Add a team member";document.getElementById("tmSave").textContent="Add member";document.getElementById("tmCancel").hidden=true;document.getElementById("tmMsg").textContent="";}
function teamPaint(){const el=document.querySelector('[data-dyn="team"]');if(el)el.innerHTML=D.team();teamChrome();}
document.addEventListener("submit",async ev=>{if(ev.target.id!=="teamForm")return;ev.preventDefault();
 const msg=document.getElementById("tmMsg");msg.textContent="";
 const name=document.getElementById("tmName").value.trim(),role=document.getElementById("tmRole").value.trim(),raw=document.getElementById("tmLink").value.trim();
 if(!name){msg.textContent="Enter a name.";document.getElementById("tmName").focus();return;}
 const link=raw?safeUrl(raw):"";if(raw&&!link){msg.textContent="Enter a web address starting with https://";document.getElementById("tmLink").focus();return;}
 const btn=document.getElementById("tmSave");btn.disabled=true;
 try{if(TEAM.editing){await TEAM.col.doc(TEAM.editing).update({name,role,link});toast("Changes saved");}
  else{const order=TEAM.list.reduce((a,m)=>Math.max(a,num(m.order)?m.order:0),0)+1;await TEAM.col.add({name,role,link,order});toast("Member added");}
  teamReset();}
 catch(e){msg.textContent=e&&e.code==="permission_denied"?"Only the page owner and editors can change the team list.":"Could not save — "+(e&&e.message||"try again.");}
 finally{btn.disabled=false;}});
(async()=>{let db=null,user=null;try{[db,user]=await Promise.all([window.claude?.use?window.claude.use("db"):null,window.claude?.use?window.claude.use("user"):null]);}catch(e){}
 if(!db){TEAM.state="off";teamPaint();return;}
 try{TEAM.canEdit=user?await user.canEdit():false;}catch(e){TEAM.canEdit=false;}
 TEAM.col=db.collection("team");
 TEAM.col.orderBy("order","asc").onSnapshot(snap=>{TEAM.list=snap.docs.map(d=>({id:d.id,...d.data()}));TEAM.state="ready";teamPaint();},
  ()=>{TEAM.state="error";teamPaint();});})();
function route(){const h=location.hash.slice(1);tab=TABS.some(t=>t[0]===h)?h:"overview";render();window.scrollTo(0,0);}
window.addEventListener("hashchange",route);
load();route();
</script>
